<html lang="en">

  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    #kit-scroll { background: var(--cream); }
    @keyframes hl-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hl-rise { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: none; } }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--brown) 22%, transparent); border-radius: 999px; border: 3px solid var(--cream); }
  </style>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
