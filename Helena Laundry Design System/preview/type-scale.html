<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; flex-direction:column; gap:2px; }
  .r { display:flex; align-items:baseline; gap:16px; border-bottom:1px solid var(--rule); padding:5px 0; }
  .r .s { font-family:var(--font-display); color:var(--brown); line-height:1.05; flex:1; white-space:nowrap; overflow:hidden; }
  .r .t { font-size:11px; color:var(--fg3); font-variant-numeric:tabular-nums; width:130px; text-align:right; }
</style></head>
<body>
  <div class="r"><div class="s" style="font-size:48px">Display 48</div><div class="t">--text-4xl · h-hero</div></div>
  <div class="r"><div class="s" style="font-size:36px">Heading 36</div><div class="t">--text-3xl · h2</div></div>
  <div class="r"><div class="s" style="font-size:28px">Subhead 28</div><div class="t">--text-2xl · h3</div></div>
  <div class="r"><div class="s" style="font-size:22px; font-family:var(--font-sans); font-weight:700">Title 22</div><div class="t">--text-xl · h4 (sans)</div></div>
  <div class="r"><div class="s" style="font-size:16px; font-family:var(--font-sans)">Body 16 — the baseline reading size</div><div class="t">--text-base</div></div>
  <div class="r" style="border:none"><div class="s" style="font-size:12px; font-family:var(--font-sans); color:var(--fg3)">Caption 12</div><div class="t">--text-xs</div></div>
</body></html>
