<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; gap:18px; align-items:flex-start; }
  .col { display:flex; flex-direction:column; gap:6px; flex:1; }
  label { font-size:13px; font-weight:600; color:var(--fg1); }
  input, select { font-family:var(--font-sans); font-size:15px; color:var(--fg1); background:var(--white); border:1.5px solid var(--rule-strong); border-radius:12px; padding:12px 14px; outline:none; }
  input::placeholder { color:var(--fg3); }
  .focused { border-color:var(--teal); box-shadow:0 0 0 3px color-mix(in oklab, var(--teal) 22%, transparent); }
  .chk { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--fg1); margin-top:4px; }
  .box { width:22px; height:22px; border-radius:6px; background:var(--rust); display:flex; align-items:center; justify-content:center; color:var(--cream); font-size:14px; }
</style></head>
<body>
  <div class="col">
    <label>Your name</label>
    <input placeholder="Jane from Helena">
    <div class="chk"><span class="box">✓</span> Free pickup over $35</div>
  </div>
  <div class="col">
    <label>Pickup day</label>
    <input class="focused" value="Tuesday">
    <span style="font-size:11px;color:var(--teal);font-weight:600">focused · teal ring</span>
  </div>
</body></html>
