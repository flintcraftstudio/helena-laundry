<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; flex-direction:column; gap:12px; }
  .eb { font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.14em; color:var(--teal); }
  .lead { font-size:18px; color:var(--fg2); line-height:1.6; max-width:60ch; }
  .body { font-size:15px; color:var(--fg1); line-height:1.6; max-width:60ch; }
  .wts { display:flex; gap:18px; font-size:14px; color:var(--fg2); }
  .wts b { color:var(--fg1); } .wts .m { font-weight:500; } .wts .s { font-weight:600; } .wts .bd { font-weight:700; }
  .meta { font-size:12px; color:var(--fg3); }
</style></head>
<body>
  <div class="eb">WASH · FOLD · DELIVER</div>
  <div class="lead">We pick up Tuesdays and have it back to your door by Friday.</div>
  <div class="body">Drop the chores, keep the day. DM Sans keeps body and UI text highly legible with generous, comfortable line spacing.</div>
  <div class="wts"><span>Regular 400</span><span class="m">Medium 500</span><span class="s">Semibold 600</span><span class="bd">Bold 700</span></div>
  <div class="meta">DM Sans · body, UI, eyebrows</div>
</body></html>
