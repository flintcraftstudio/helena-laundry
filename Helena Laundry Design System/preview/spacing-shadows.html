<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { background:var(--cream); display:flex; gap:26px; align-items:center; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .box { width:120px; height:70px; background:var(--white); border-radius:var(--radius-md); }
  .s-sm { box-shadow:var(--shadow-sm); }
  .s-md { box-shadow:var(--shadow-md); }
  .s-lg { box-shadow:var(--shadow-lg); }
  .s-rust { box-shadow:var(--shadow-rust); background:var(--rust); }
  .lbl { font-size:12px; color:var(--fg2); font-weight:600; }
  .sub { font-size:11px; color:var(--fg3); }
</style></head>
<body>
  <div class="sw"><div class="box s-sm"></div><div class="lbl">sm</div></div>
  <div class="sw"><div class="box s-md"></div><div class="lbl">md</div></div>
  <div class="sw"><div class="box s-lg"></div><div class="lbl">lg</div></div>
  <div class="sw"><div class="box s-rust"></div><div class="lbl" style="color:var(--rust)">rust glow</div><div class="sub">primary buttons</div></div>
</body></html>
