<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding:0; }
  .bar { display:flex; height:120px; font-family:var(--font-sans); }
  .seg { display:flex; align-items:flex-end; padding:12px 14px; font-size:13px; font-weight:600; }
  .c60 { flex:60; background:var(--cream); color:var(--fg2); }
  .c30 { flex:30; background:var(--rust); color:var(--cream); }
  .c10 { flex:10; background:var(--teal); color:var(--cream); }
  .note { padding:14px 32px; font-size:13px; color:var(--fg2); }
  .note b { color:var(--fg1); }
</style></head>
<body>
  <div class="bar">
    <div class="seg c60">60% · cream + white</div>
    <div class="seg c30">30% · one accent</div>
    <div class="seg c10">10%</div>
  </div>
  <div class="note"><b>The 60 / 30 / 10 rule.</b> Calm cream surfaces dominate; one accent carries the page; teal + ochre stay as small pops.</div>
</body></html>
