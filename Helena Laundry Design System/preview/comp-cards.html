<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; gap:16px; }
  .cardx { background:var(--white); border-radius:16px; box-shadow:var(--shadow-md); padding:22px; flex:1; display:flex; flex-direction:column; gap:10px; }
  .ic { width:46px; height:46px; border-radius:12px; background:color-mix(in oklab, var(--teal) 14%, var(--white)); display:flex; align-items:center; justify-content:center; }
  .ic svg { width:24px; height:24px; color:var(--teal); }
  .ic.r { background:color-mix(in oklab, var(--rust) 12%, var(--white)); }
  .ic.r svg { color:var(--rust); }
  h3 { font-family:var(--font-display); font-size:22px; margin:0; color:var(--brown); }
  p { font-size:14px; color:var(--fg2); margin:0; line-height:1.55; }
</style></head>
<body>
  <div class="cardx">
    <div class="ic r"><i data-lucide="washing-machine"></i></div>
    <h3>Wash & fold</h3>
    <p>We sort lights from darks like it's a sport. You enjoy the fresh-folded stack.</p>
  </div>
  <div class="cardx">
    <div class="ic"><i data-lucide="truck"></i></div>
    <h3>Pickup & delivery</h3>
    <p>We pick up Tuesdays and have it back to your door by Friday.</p>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body></html>
