<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .tag { font-family:var(--font-sans); font-weight:700; font-size:12px; letter-spacing:0.04em; border-radius:999px; padding:6px 14px; display:inline-flex; align-items:center; gap:6px; }
  .ochre { background:var(--ochre); color:var(--brown); }
  .teal { background:color-mix(in oklab, var(--teal) 16%, var(--white)); color:var(--teal-deep); }
  .rust { background:color-mix(in oklab, var(--rust) 12%, var(--white)); color:var(--rust); }
  .pill-out { border:1.5px solid var(--rule-strong); color:var(--fg2); background:transparent; }
  .stars { display:flex; gap:3px; color:var(--ochre); font-size:20px; }
  .eb { font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.14em; color:var(--teal); }
</style></head>
<body>
  <span class="tag ochre">★ Local favorite</span>
  <span class="tag teal">Eco detergent</span>
  <span class="tag rust">Same-week</span>
  <span class="tag pill-out">$2.10 / lb</span>
  <div class="stars">★★★★★</div>
  <span class="eb">WASH · FOLD · DELIVER</span>
</body></html>
