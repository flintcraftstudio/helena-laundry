<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; gap:14px; }
  .panel { flex:1; border-radius:var(--radius-md); padding:18px 20px; border:1px solid var(--rule); }
  .panel.cream { background:var(--white); }
  .panel.rust { background:var(--rust); border-color:transparent; }
  .panel.teal { background:var(--teal-deep); border-color:transparent; }
  .l1 { font-size:18px; font-weight:600; }
  .l2 { font-size:14px; margin-top:4px; }
  .l3 { font-size:12px; margin-top:4px; }
  .cream .l1 { color:var(--fg1); } .cream .l2 { color:var(--fg2); } .cream .l3 { color:var(--fg3); }
  .rust .l1, .teal .l1 { color:#FFFFFF; }
  .rust .l2, .teal .l2 { color:color-mix(in oklab, #FFFFFF 92%, transparent); }
  .tag { font-size:11px; color:var(--fg3); margin-top:10px; font-variant-numeric:tabular-nums; }
  .rust .tag, .teal .tag { color:color-mix(in oklab,#FFFFFF 85%, transparent); }
</style></head>
<body>
  <div class="panel cream">
    <div class="l1">Primary text</div>
    <div class="l2">Secondary text — calm and quiet</div>
    <div class="l3">Tertiary / captions</div>
    <div class="tag">fg1 / fg2 / fg3 on white</div>
  </div>
  <div class="panel rust">
    <div class="l1">On rust</div>
    <div class="l2">White text lifts off the accent</div>
    <div class="tag">--fg-on-rust</div>
  </div>
  <div class="panel teal">
    <div class="l1">On teal</div>
    <div class="l2">Same cream, cool ground</div>
    <div class="tag">--fg-on-teal</div>
  </div>
</body></html>
