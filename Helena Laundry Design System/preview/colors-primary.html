<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .sw { display:flex; flex-direction:column; gap:8px; }
  .chip { height:96px; border-radius:var(--radius-md); border:1px solid var(--rule); box-shadow:var(--shadow-xs); display:flex; align-items:flex-end; padding:10px; }
  .name { font-weight:700; font-size:14px; }
  .hex { font-size:12px; color:var(--fg3); font-variant-numeric:tabular-nums; }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--cream)"></div><div><div class="name">Cream</div><div class="hex">#F2EBD8 · base</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rust)"></div><div><div class="name">Rust</div><div class="hex">#C0492B · primary</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal)"></div><div><div class="name">Teal</div><div class="hex">#3E7E8C · secondary</div></div></div>
  </div>
</body></html>
