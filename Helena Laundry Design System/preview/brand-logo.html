<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; align-items:center; gap:36px; }
  .badge { width:170px; height:170px; flex:none; }
  .full { width:150px; height:150px; border-radius:var(--radius-lg); border:1px solid var(--rule); flex:none; }
  .meta { display:flex; flex-direction:column; gap:10px; }
  .word { font-family:var(--font-display); font-size:40px; line-height:1; color:var(--rust); }
  .word span { color:var(--brown); }
  .tag { font-size:13px; color:var(--fg2); max-width:300px; line-height:1.5; }
</style></head>
<body>
  <img class="badge" src="../assets/helena_laundry_badge.png" alt="Helena Laundry badge">
  <div class="meta">
    <div class="word">Helena <span>Laundry</span></div>
    <div class="eyebrow" style="color:var(--teal)">WASH · FOLD · DELIVER</div>
    <div class="tag">The badge is the hero. Use the transparent circular cut-out on any surface; keep generous clearspace and never crowd her.</div>
  </div>
  <img class="full" src="../assets/helena_laundry_logo.png" alt="Full logo on cream">
</body></html>
