<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; flex-direction:column; gap:6px; }
  .big { font-family:var(--font-display); font-size:64px; line-height:0.98; color:var(--brown); }
  .big .ru { color:var(--rust); }
  .row { display:flex; align-items:baseline; gap:14px; margin-top:6px; }
  .it { font-family:var(--font-display); font-style:italic; font-size:30px; color:var(--fg2); }
  .meta { font-size:12px; color:var(--fg3); }
</style></head>
<body>
  <div class="big">Strong hands, <span class="ru">soft towels.</span></div>
  <div class="row">
    <div class="it">fresh-folded</div>
    <div class="meta">DM Serif Display · Regular + Italic · headings & display</div>
  </div>
</body></html>
