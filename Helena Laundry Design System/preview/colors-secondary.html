<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .sw { display:flex; flex-direction:column; gap:8px; }
  .chip { height:84px; border-radius:var(--radius-md); border:1px solid var(--rule); box-shadow:var(--shadow-xs); }
  .name { font-weight:700; font-size:13px; }
  .hex { font-size:11px; color:var(--fg3); font-variant-numeric:tabular-nums; }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--ochre)"></div><div><div class="name">Ochre</div><div class="hex">#D99A3D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brown)"></div><div><div class="name">Brown</div><div class="hex">#3A2A1E · text</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--white)"></div><div><div class="name">White</div><div class="hex">#FFFFFF · cards</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cream-deep)"></div><div><div class="name">Cream deep</div><div class="hex">#EAE0C7</div></div></div>
  </div>
</body></html>
