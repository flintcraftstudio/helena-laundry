<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding:0; background:var(--cream); }
  .nav { display:flex; align-items:center; gap:24px; padding:16px 28px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand img { width:42px; height:42px; }
  .brand .nm { font-family:var(--font-display); font-size:22px; color:var(--rust); line-height:1; }
  .brand .nm span { color:var(--brown); }
  .links { display:flex; gap:24px; margin-left:8px; }
  .links a { font-family:var(--font-sans); font-size:15px; font-weight:500; color:var(--fg1); text-decoration:none; }
  .links a:hover { color:var(--rust); }
  .spacer { flex:1; }
  .btn { font-family:var(--font-sans); font-weight:600; font-size:14px; border-radius:999px; padding:11px 22px; background:var(--rust); color:var(--cream); border:none; }
</style></head>
<body>
  <div class="nav">
    <div class="brand"><img src="../assets/helena_laundry_badge.png"><div class="nm">Helena <span>Laundry</span></div></div>
    <div class="links"><a>Services</a><a>Pricing</a><a>How it works</a><a>About</a></div>
    <div class="spacer"></div>
    <button class="btn">Schedule a pickup</button>
  </div>
</body></html>
