<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .btn { font-family:var(--font-sans); font-weight:600; font-size:15px; border-radius:999px; padding:13px 26px; border:none; background:var(--rust); color:var(--cream); }
  .hover { background:var(--rust-deep); box-shadow:var(--shadow-rust); }
  .press { background:var(--rust-deep); transform:scale(0.97); }
  .disabled { background:color-mix(in oklab, var(--brown) 10%, var(--cream)); color:var(--brown-soft); cursor:not-allowed; }
  .lbl { font-size:11px; color:var(--fg3); }
</style></head>
<body>
  <div class="sw"><button class="btn">Default</button><div class="lbl">rest</div></div>
  <div class="sw"><button class="btn hover">Hover</button><div class="lbl">darken + lift</div></div>
  <div class="sw"><button class="btn press">Pressed</button><div class="lbl">scale 0.97</div></div>
  <div class="sw"><button class="btn disabled">Disabled</button><div class="lbl">muted</div></div>
</body></html>
