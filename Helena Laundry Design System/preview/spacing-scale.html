<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { display:flex; flex-direction:column; gap:14px; }
  .scale { display:flex; align-items:flex-end; gap:10px; }
  .u { background:var(--teal); border-radius:3px; width:22px; }
  .u + .cap { } 
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .cap { font-size:10px; color:var(--fg3); font-variant-numeric:tabular-nums; }
  .ring-demo { display:flex; align-items:center; gap:14px; }
  .ringtxt { font-size:12px; color:var(--fg2); }
</style></head>
<body>
  <div class="scale">
    <div class="col"><div class="u" style="height:4px"></div><div class="cap">4</div></div>
    <div class="col"><div class="u" style="height:8px"></div><div class="cap">8</div></div>
    <div class="col"><div class="u" style="height:12px"></div><div class="cap">12</div></div>
    <div class="col"><div class="u" style="height:16px"></div><div class="cap">16</div></div>
    <div class="col"><div class="u" style="height:24px"></div><div class="cap">24</div></div>
    <div class="col"><div class="u" style="height:32px"></div><div class="cap">32</div></div>
    <div class="col"><div class="u" style="height:48px"></div><div class="cap">48</div></div>
    <div class="col"><div class="u" style="height:64px"></div><div class="cap">64</div></div>
    <div class="col"><div class="u" style="height:80px"></div><div class="cap">96</div></div>
  </div>
  <div class="ring-demo">
    <hr class="rule-double" style="flex:1">
    <span class="ringtxt">double-ring rule · echoes the badge border</span>
    <hr class="rule-double" style="flex:1">
  </div>
</body></html>
